<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;padding:40px 20px;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">
        <tr>
          <td align="center" style="padding-bottom:32px;">
            <table cellpadding="0" cellspacing="0">
              <tr>
                <td style="background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:10px;padding:8px 12px;">
                  <span style="font-size:14px;font-weight:700;color:#fff;">T</span>
                </td>
                <td style="padding-left:10px;">
                  <span style="font-size:18px;font-weight:700;color:#ffffff;">Tabib</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background-color:#111111;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:40px 36px;">
            <h1 style="margin:0 0 8px;font-size:20px;font-weight:700;color:#ffffff;text-align:center;">Verify your email</h1>
            <p style="margin:0 0 32px;font-size:14px;color:#71717a;text-align:center;line-height:1.5;">
              Enter this code to verify your email:
            </p>
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding-bottom:32px;">
                  <div style="background-color:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:18px 0;display:inline-block;min-width:220px;text-align:center;">
                    <span style="font-size:34px;font-weight:700;color:#ffffff;letter-spacing:10px;font-family:'Courier New',monospace;">{{otp_code}}</span>
                  </div>
                </td>
              </tr>
            </table>
            <table width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background-color:rgba(255,255,255,0.03);border-radius:10px;padding:14px 18px;">
                  <p style="margin:0;font-size:12px;color:#52525b;line-height:1.6;">
                    Code expires in 5 minutes. If you didn't sign up for {{app_name}}, ignore this email.
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:28px;">
            <p style="margin:0;font-size:11px;color:#3f3f46;">
              {{app_name}} — Health Assistant
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
